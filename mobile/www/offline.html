<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SICRM</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0F; color: #F3F4F6; font-family: -apple-system, system-ui, Roboto, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 0; }
    p { margin: 0; color: #9CA3AF; font-size: 15px; line-height: 1.45; max-width: 320px; }
    button { margin-top: 6px; background: #E63946; color: #fff; border: 0; border-radius: 12px; padding: 13px 28px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <img src="icon.png" alt="" />
  <h1>Internet aloqasi yo'q</h1>
  <p>Ilovani birinchi marta ochish uchun internet kerak. Aloqa tiklangach, qayta urinib ko'ring.</p>
  <button id="retry">Qayta urinish</button>
  <script>
    document.getElementById('retry').onclick = function () {
      var s = null; try { s = JSON.parse(localStorage.getItem('sicrm_company') || 'null') } catch (e) {}
      location.href = s && s.url ? s.url : 'index.html'
    }
  </script>
</body>
</html>
