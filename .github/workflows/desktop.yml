name: Kompyuter dasturi

# Windows (.exe o'rnatuvchi) va Mac (.dmg) — desktop/ (Electron). Dastur https://<kod>.sicrm.uz ni ochadi,
# shuning uchun oddiy frontend deploy uchun qayta yig'ish shart emas; faqat desktop/ yoki mobile/www o'zgarsa.
# Natija — "desktop-latest" relizi (doimiy havolalar; Windows dasturi shu yerdan o'zi yangilanadi).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'mobile/www/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              desktop/dist/SICRM-Setup.exe
              desktop/dist/SICRM-Setup.exe.blockmap
              desktop/dist/latest.yml
          - os: macos-latest
            script: dist:mac
            files: |
              desktop/dist/SICRM.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Versiya (1.0.<yig'ish raqami>)
        working-directory: desktop
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Yig'ish
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: sicrm-desktop-${{ matrix.os }}-${{ github.run_number }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: desktop-latest relizini yangilash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest out/* \
            --title "SICRM kompyuter dasturi 1.0.${{ github.run_number }}" \
            --notes "Windows: SICRM-Setup.exe · Mac: SICRM.dmg. Dastur ochilganda kompaniya kodini kiriting (masalan ceramix)." \
            --latest=false
