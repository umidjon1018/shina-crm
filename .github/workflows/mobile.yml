name: Mobil ilova

# Android (APK) va iOS ilovasini bulutda yig'adi. Do'konlarga chiqarilmaydi — imzolangan APK
# GitHub Release'ga qo'yiladi va mijozga havola bilan beriladi. Ilova https://gt.sicrm.uz ni ochadi —
# oddiy frontend deploy uchun qayta yig'ish shart emas; faqat native qism o'zgarsa ishga tushadi.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versiya nomi (masalan 1.0.1)"
        required: false
        default: "1.0"
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'mobile/**'
      - 'capacitor.config.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync android
      - name: Debug APK (sinov uchun telefonga o'rnatiladi)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            echo "::error title=Gradle::$(grep -E 'error|What went wrong|FAILURE|>' "$RUNNER_TEMP/gradle.log" | tail -25 | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
      - name: Imzolangan APK (mijozlarga beriladi) — kalit secrets'da bo'lsa
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: sicrm
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/sicrm.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sicrm-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: GitHub Release (doimiy havola .../releases/latest/download/sicrm.apk)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" sicrm.apk             --title "SICRM Android ${VERSION_NAME} (${{ github.run_number }})"             --notes "Android ilova. O'rnatish: faylni telefonda oching → 'Noma'lum manbalardan o'rnatish'ga ruxsat bering." --latest

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync ios
      - name: iOS yig'ish tekshiruvi (simulyator, imzosiz)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Simulyator ilovasi
        run: cd ios/App/build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/sicrm-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: sicrm-ios-simulator-${{ github.run_number }}
          path: sicrm-ios-simulator.zip
